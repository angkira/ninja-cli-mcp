stages:
  - lint
  - build
  - publish

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  key: uv-${CI_COMMIT_REF_SLUG}
  paths:
    - .uv-cache/

lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  script:
    - uv sync --frozen --all-extras
    - uv run ruff check src/
    - uv run ruff format --check src/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

build:
  stage: build
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

publish:
  stage: publish
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  needs: [build]
  script:
    - uv publish --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" --token "job-token:${CI_JOB_TOKEN}" dist/*
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
